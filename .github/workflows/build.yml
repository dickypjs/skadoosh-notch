name: Build SkadooshNotch EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SkadooshNotch.csproj

      - name: Build & Publish (Framework-Dependent, ~3 MB)
        run: dotnet publish SkadooshNotch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o publish/

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkadooshNotch-exe
          path: publish/SkadooshNotch.exe
          if-no-files-found: error
          retention-days: 30
