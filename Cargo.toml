[package]
name = "skadoosh-notch"
version = "1.2.0"
edition = "2021"
authors = ["Dicky Pujakesuma <dicky@tisma.sch.id>"]
description = "Lightweight Dynamic Island / Notch for Windows written in Rust"

[dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Com",
    "Media_Control",
    "Storage_Streams",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
